name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: "pip install --only-binary :all: ruff==0.16.7"
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: "pip install --require-hashes --only-binary :all: --no-binary antlr4-python3-runtime -r requirements.lock.txt"
      - run: pytest -q

  model-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: "pip install --require-hashes --only-binary :all: --no-binary antlr4-python3-runtime -r requirements.lock.txt"
      # Weights come from Git LFS. The dataset comes from the Google Drive
      # remote in .dvc/config. Without the service-account secret the pull is
      # skipped and the gate fails closed (CI_REQUIRE_MODEL_GATE), instead of
      # reporting success for a test that never scored a model.
      - name: Pull BreakHis and checkpoints when Drive credentials exist
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GDRIVE_SERVICE_ACCOUNT_JSON is unset. The quality gate will fail until data can be pulled."
            exit 0
          fi
          # Not in requirements.lock.txt, so this step cannot use --require-hashes.
          # --only-binary matches the other installs; antlr4 has no wheel.
          python -m pip install --only-binary :all: --no-binary antlr4-python3-runtime 'dvc[gdrive]==3.67.1'
          creds="$RUNNER_TEMP/gdrive-sa.json"
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$creds"
          dvc remote modify --local gdrive gdrive_use_service_account true
          dvc remote modify --local gdrive gdrive_service_account_json_file_path "$creds"
          dvc pull data/BreaKHis_v1.dvc checkpoints.dvc
      - name: Validation-patient quality gate
        env:
          CI_REQUIRE_MODEL_GATE: "1"
        run: pytest tests/test_model_validation.py tests/test_subtype_validation.py -rs

  smoke-train:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: "pip install --require-hashes --only-binary :all: --no-binary antlr4-python3-runtime -r requirements.lock.txt"
      # Inside the workspace: the training CLI only accepts a data root within
      # the project directory.
      - run: python scripts/make_smoke_dataset.py --root smoke_data
      - run: |
          python -m src.training.train \
            --data-root smoke_data \
            --magnification 40 \
            --train-config configs/train_smoke.yaml \
            --data-config configs/data.yaml \
            --mlflow-tracking-uri sqlite:////tmp/smoke_mlflow.db \
            --no-pretrained
      - run: |
          python -m src.training.train_subtype \
            --data-root smoke_data \
            --train-config configs/train_subtype_smoke.yaml \
            --data-config configs/data.yaml \
            --mlflow-tracking-uri sqlite:////tmp/smoke_mlflow.db \
            --no-pretrained

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: breast-cancer-classification:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
