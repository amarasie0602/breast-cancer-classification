name: Promote Dev to Main

on:
  schedule:
    # Runs every day at 7:00 AM Sri Lanka time
    # 07:00 SLST = 01:30 UTC
    - cron: "30 1 * * *"

  # Allows you to manually run the workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      # Get the complete Git history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Promote commits
        env:
          # Change this to your actual starting date
          START_DATE: "2026-09-17"

          # Number of days over which commits will be promoted
          TOTAL_DAYS: "30"

        run: |
          set -euo pipefail

          # Git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Get latest branches
          git fetch origin main dev

          # Count commits that are on dev but not main
          remaining_commits=$(git rev-list --count origin/main..origin/dev)

          if [ "$remaining_commits" -eq 0 ]; then
            echo "No commits remaining to promote."
            exit 0
          fi

          # Current date
          today=$(date -u +%Y-%m-%d)

          start_epoch=$(date -u -d "$START_DATE" +%s)
          today_epoch=$(date -u -d "$today" +%s)

          # Which day of the promotion period?
          day_index=$(( (today_epoch - start_epoch) / 86400 + 1 ))

          # Don't start before START_DATE
          if [ "$day_index" -lt 1 ]; then
            echo "Promotion hasn't started yet."
            exit 0
          fi

          # Days remaining
          remaining_days=$(( TOTAL_DAYS - day_index + 1 ))

          # Last day → promote everything remaining
          if [ "$remaining_days" -le 1 ]; then

            batch=$remaining_commits

          else

            # Average commits needed per remaining day
            avg=$(( (remaining_commits + remaining_days - 1) / remaining_days ))

            # Random range around average
            min=$(( avg / 2 ))

            if [ "$min" -lt 1 ]; then
              min=1
            fi

            max=$(( avg * 3 / 2 ))

            if [ "$max" -gt "$remaining_commits" ]; then
              max=$remaining_commits
            fi

            if [ "$max" -lt "$min" ]; then
              max=$min
            fi

            range=$(( max - min + 1 ))

            # Choose today's batch size
            batch=$(( min + RANDOM % range ))

          fi

          echo "======================================"
          echo "Promotion day: $day_index / $TOTAL_DAYS"
          echo "Remaining commits: $remaining_commits"
          echo "Promoting today: $batch"
          echo "======================================"

          # Find the commit that should become the new main HEAD
          target_sha=$(git rev-list \
            --reverse origin/main..origin/dev \
            | sed -n "${batch}p")

          # Move main forward through existing commits
          git checkout main

          git merge --ff-only "$target_sha"

          # Push main
          git push origin main

          echo "Successfully promoted $batch commits."
