name: CD

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/breast-cancer-classifier

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker push $IMAGE:${{ github.sha }}
      - run: docker push $IMAGE:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook (Render/Railway) if configured
        run: |
          if [ -n "${{ secrets.DEPLOY_HOOK_URL }}" ]; then
            curl -fsS -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
          else
            echo "No DEPLOY_HOOK_URL secret set — skipping deploy. See README for how to add one."
          fi
