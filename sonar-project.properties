# Two intentional PRNG uses, neither security-sensitive:
# - src/data/splits.py: random.Random(seed).shuffle() makes the patient-level
#   train/val/test split reproducible. A cryptographic PRNG can't be seeded
#   the same way, so it would break reproducibility entirely.
# - notebooks/01_eda.ipynb: random.sample() just picks images for a display
#   grid in an EDA notebook.
#
# - src/serving/static/index.html: the dropzone <div> has a real keyboard
#   handler (addEventListener("keydown", ...) in the page's own <script>,
#   handling Enter/Space) alongside its click handler, plus tabindex="0"
#   and role="button" -- it's genuinely keyboard-accessible. The rule only
#   looks for an inline onKeyDown/onKeyUp attribute and can't see handlers
#   wired up imperatively via addEventListener.
