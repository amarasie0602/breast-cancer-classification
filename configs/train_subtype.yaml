epochs: 10
batch_size: 32
learning_rate: 1.0e-4
weight_decay: 1.0e-5
lr_scheduler:
  patience: 2
  factor: 0.5
early_stopping:
  patience: 3
  min_delta: 0.001
freeze_backbone_epochs: 1
checkpoint_dir: checkpoints
dataset_root: data/BreaKHis_v1
split_ratios:
  train: 0.7
  val: 0.15
  test: 0.15
seed: 42
