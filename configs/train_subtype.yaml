# Tuned against an observed failure mode: with learning_rate 1e-4 and the
# backbone unfrozen after a single epoch, train loss dropped 1.35 -> 0.86
# while val loss ROSE 1.39 -> 1.86 -- textbook overfitting, unsurprising
# when 3 of the 4 subtypes have only 4-6 training patients each.
# So: hold the backbone frozen longer, drop the LR once it unfreezes, and
# lean harder on weight decay.
epochs: 12
batch_size: 32
learning_rate: 3.0e-5
weight_decay: 1.0e-4
lr_scheduler:
  patience: 2
  factor: 0.5
early_stopping:
  patience: 4
  min_delta: 0.001
freeze_backbone_epochs: 3
checkpoint_dir: checkpoints
